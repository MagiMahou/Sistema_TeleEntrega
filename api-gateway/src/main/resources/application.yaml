server:
  port: 8765

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: pizzaria-service
          uri: lb://pizzaria-service
          predicates:
            - Path=/clientes/**, /pedidos/**, /cardapio/**, /admin/**, /cozinha/**
        
        - id: estoque-service
          uri: lb://estoque-service
          predicates:
            - Path=/estoque/**
            
        - id: entregas-service
          uri: lb://entregas-service
          predicates:
            - Path=/entrega/**

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
    gateway:
      enabled: true