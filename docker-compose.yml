version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    container_name: rabbitmq

  naming-server:
    build:
      context: ./naming-server
    ports:
      - "8761:8761"
    container_name: naming-server

  api-gateway:
    build:
      context: ./api-gateway
    ports:
      - "8765:8765"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://naming-server:8761/eureka
    depends_on:
      - naming-server
    container_name: api-gateway

  estoque-service:
    build:
      context: ./estoque-service
    ports:
      - "8081:8081"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://naming-server:8761/eureka
    volumes:
      - ./dados-estoque:/app/dados
    depends_on:
      - naming-server
    container_name: estoque-service

  pizzaria-service:
    build:
      context: .
    ports:
      - "8080:8080"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://naming-server:8761/eureka
      - SPRING_RABBITMQ_HOST=rabbitmq
    volumes:
      - ./dados-pizzaria:/app/dados
    depends_on:
      - naming-server
      - rabbitmq
    container_name: pizzaria-service

  entregas-service:
    build:
      context: ./entregas-service
    ports:
      - "8082-8084:8082"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://naming-server:8761/eureka
      - SPRING_RABBITMQ_HOST=rabbitmq
    volumes:
      - ./dados-entregas:/app/dados
    depends_on:
      - naming-server
      - rabbitmq
    deploy:
      replicas: 3
